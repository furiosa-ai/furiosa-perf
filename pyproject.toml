[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "furiosa-perf"
version = "0.0.1"
description = "LLM serving performance benchmark CLI for Furiosa NPU and NVIDIA GPU"
authors = [{name = "Furiosa AI Inc."}]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.10"
keywords = ["benchmark", "llm", "furiosa", "npu", "gpu", "vllm", "performance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Benchmark",
]

dependencies = [
    "click>=8.0.0",
    "requests>=2.32.0",
    "PyYAML>=6.0.0",
    "pandas>=2.3.3",
    "numpy>=2.2.6",
    "psutil>=5.9.0",
    "huggingface-hub",
    "pytablewriter",
    "uv>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/furiosa-ai/furiosa-perf"
Repository = "https://github.com/furiosa-ai/furiosa-perf"
"Bug Tracker" = "https://github.com/furiosa-ai/furiosa-perf/issues"

[project.scripts]
furiosa-perf = "furiosa_perf.cli.main:cli"

[project.optional-dependencies]
furiosa-llm = ["furiosa-llm>=2026.2"]
vllm = ["vllm>=0.20.1"]

dev = [
    "pytest",
    "black",
    "ruff",
    "pydoclint",
    "mypy",
    "pre-commit",
    "types-requests",
    "distro",
]

[tool.mypy]
packages = ["furiosa_perf"]
python_version = "3.10"
ignore_missing_imports = true
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true

[tool.pydoclint]
style = "google"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "S", "NPY", "PTH"]
ignore = ["E203", "E501"]
fixable = ["ALL"]

[tool.black]
line-length = 120
target-version = ["py312"]
