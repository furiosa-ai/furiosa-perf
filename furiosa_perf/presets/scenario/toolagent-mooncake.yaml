# Service scenario replaying a production tool-and-agent trace: Moonshot AI's Kimi
# tool/agent workload from the Mooncake FAST'25 trace release (one hour of requests,
# Apache-2.0), the sibling of chat-mooncake's conversation trace. Requests carry a
# few fixed prompts (tool definitions, about 4.6k tokens) shared by most of them, a
# short query, and a short reply (half of them under 30 tokens): almost pure prefill
# with prefix reuse right away, where the conversation trace reuses blocks minutes apart.
#
# Same machinery as chat-mooncake: hash ids become fixed 512-token blocks, requests
# are sent at their recorded times stretched to a fraction of the recorded speed, and
# a bisection finds the highest speed whose point meets the SLO.
kind: scenario
task: toolagent-mooncake
client: aiperf

trace:
  source: https://raw.githubusercontent.com/kvcache-ai/Mooncake/main/FAST25-release/traces/toolagent_trace.jsonl
  sha256: 48a2db1a13d3bc05e6330140c64f604ba366df20d3c9e128b5c35a01c1fa5f71
  license: Apache-2.0 (kvcache-ai/Mooncake, FAST'25 trace release)
  replay: recorded timestamps, stretched by 100 / speed

restart-server: per-point

server:
  enable-prefix-caching: true
  max-model-len: 40960  # requests above this (about 2 % of the trace) are left out and counted
  default-chat-template-kwargs: {enable_thinking: false}

slo:
  ttft_p95_ms: 3000
  tpot_p95_ms: 50

args:
  endpoint-type: chat
  streaming: true
  extra-inputs: {ignore_eos: true}
  trace-duration: 600
  trace-start: 1800  # same slice as chat-mooncake, so the two traces are compared over the same hour position
  trace-warmup: 30
  benchmark-grace-period: 120
  random-seed: 0

search:
  key: trace-speed-pct
  min: 5
  max: 100
  step: 5
