# Fixed-length baseline for embedding models: random inputs of a fixed length, closed-loop
# concurrency sweep. Short inputs are search queries, long ones documents being indexed; the second
# row sends several inputs in one request, as an indexing job does.
kind: baseline
task: embedding
client: vllm-bench

server:
  no-enable-prefix-caching: true

args:
  backend: openai-embeddings
  endpoint: /v1/embeddings
  dataset-name: random
  trust-remote-code: true
  percentile-metrics: e2el
  metric-percentiles: 25,50,75,90,95,99

# Lengths up to 8192, which every bundled embedding model accepts (bge-m3 8K; Qwen3-Embedding
# takes 32K: add a row in a preset file of your own). random-batch-size = inputs per request.
matrix:
  - {random-input-len: [32, 128, 512, 2048, 8192], random-batch-size: 1, max-concurrency: [1, 4, 8, 16, 32, 64, 128, 256]}
  - {random-input-len: 512, random-batch-size: [16, 64], max-concurrency: [1, 4, 8, 16, 32]}
