# Fixed-length baseline for reranker models: one query with N random documents per request,
# closed-loop concurrency sweep. Two axes: the length of a query+document pair and how many
# documents a query ranks (a RAG retriever hands the reranker 10 to 100 candidates).
kind: baseline
task: rerank
client: vllm-bench

server:
  no-enable-prefix-caching: true

args:
  backend: vllm-rerank
  endpoint: /v1/rerank
  dataset-name: random-rerank
  trust-remote-code: true
  percentile-metrics: e2el
  metric-percentiles: 25,50,75,90,95,99

# random-input-len is the query + document pair the model scores (vllm bench splits it in half:
# 512 = a 256-token query against 256-token documents); random-batch-size is documents per query.
# Throughput to read: pairs/s (input sequences/s) and E2EL per query.
matrix:
  - {random-input-len: [512, 1024, 2048], random-batch-size: [10, 50, 100], max-concurrency: [1, 4, 8, 16, 32, 64]}
