# Fixed-length baseline for vision-language generation as it is used: one image per request, a text
# prompt, and an answer to write. Two image sizes, a 512x512 (a document page, a screenshot) and a
# 1024x1024 (a photo); the text is sized so that text + image tokens land on a text-preset point
# (1024 or 2048 input tokens, 1024 out), so the same model's text run shows what the image costs.
kind: baseline
task: image-text
client: vllm-bench

server:
  no-enable-prefix-caching: true
  reasoning-parser: null  # Thinking models: keep thinking tokens in `content`, which the client counts

args:
  backend: openai-chat
  endpoint: /v1/chat/completions
  dataset-name: random-mm
  random-range-ratio: 0
  random-mm-base-items-per-request: 1
  random-mm-limit-mm-per-prompt: '{"image": 1}'
  ignore-eos: true
  temperature: 0
  trust-remote-code: true
  percentile-metrics: ttft,tpot,itl,e2el
  metric-percentiles: 25,50,75,90,95,99

# random-input-len is the text alone; the image's tokens come on top and differ per model. In Qwen3-VL
# (32 px per token) a 512x512 image is ~256 tokens and a 1024x1024 ~1,024, so these rows prefill ~1,024
# and ~2,048 tokens: compare with the text preset's 1024/1024 and 2048/1024. gemma-4 (256 tokens per
# image at its default budget of 280) and EXAONE-4.5 (28 px per token) land near those; the result's
# total_input_tokens, from the server's usage, is the real prompt length.
# gemma-4's budget is a server option: run again with --server-arg 'mm-processor-kwargs={"image":{"max_soft_tokens":560}}'
# (furiosa-llm; vLLM takes {"max_soft_tokens":560}) for a variant next to the default.
matrix:
  - {random-mm-bucket-config: "{(512, 512, 1): 1.0}", random-input-len: 768, random-output-len: 1024, max-concurrency: [1, 4, 8, 16, 32, 64, 128, 256]}
  - {random-mm-bucket-config: "{(1024, 1024, 1): 1.0}", random-input-len: 1024, random-output-len: 1024, max-concurrency: [1, 4, 8, 16, 32, 64, 128, 256]}
